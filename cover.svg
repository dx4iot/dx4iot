<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Main background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050505"/>
      <stop offset="40%" style="stop-color:#060d06"/>
      <stop offset="100%" style="stop-color:#020a02"/>
    </linearGradient>

    <!-- Green glow gradient for text -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff41"/>
      <stop offset="50%" style="stop-color:#39ff14"/>
      <stop offset="100%" style="stop-color:#00cc33"/>
    </linearGradient>

    <!-- Subtle accent gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff41;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#00ff41;stop-opacity:0.6"/>
      <stop offset="70%" style="stop-color:#00ff41;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#00ff41;stop-opacity:0"/>
    </linearGradient>

    <!-- Glow filter for main text -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft glow filter for lines/decorations -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00ff41" stroke-width="0.15" opacity="0.25"/>
    </pattern>

    <!-- Scanline pattern -->
    <pattern id="scan" width="1" height="3" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="black" opacity="0.15"/>
    </pattern>

    <!-- Clip for rounded corners -->
    <clipPath id="roundClip">
      <rect width="900" height="280" rx="14" ry="14"/>
    </clipPath>
  </defs>

  <!-- Base background -->
  <g clip-path="url(#roundClip)">
    <rect width="900" height="280" fill="url(#bg)"/>

    <!-- Grid overlay -->
    <rect width="900" height="280" fill="url(#grid)"/>

    <!-- Scanline overlay -->
    <rect width="900" height="280" fill="url(#scan)" opacity="0.6"/>

    <!-- Left glow orb -->
    <radialGradient id="orb1" cx="20%" cy="50%" r="35%">
      <stop offset="0%" style="stop-color:#00ff41;stop-opacity:0.07"/>
      <stop offset="100%" style="stop-color:#00ff41;stop-opacity:0"/>
    </radialGradient>
    <rect width="900" height="280" fill="url(#orb1)"/>

    <!-- Right glow orb -->
    <radialGradient id="orb2" cx="85%" cy="40%" r="30%">
      <stop offset="0%" style="stop-color:#00cc33;stop-opacity:0.05"/>
      <stop offset="100%" style="stop-color:#00cc33;stop-opacity:0"/>
    </radialGradient>
    <rect width="900" height="280" fill="url(#orb2)"/>

    <!-- Top accent line -->
    <rect x="0" y="0" width="900" height="2" fill="url(#accentGrad)" opacity="0.8"/>

    <!-- Bottom accent line -->
    <rect x="0" y="278" width="900" height="2" fill="url(#accentGrad)" opacity="0.5"/>

    <!-- Left vertical bar accent -->
    <rect x="0" y="0" width="3" height="280" fill="#00ff41" opacity="0.4"/>

    <!-- Right vertical bar accent -->
    <rect x="897" y="0" width="3" height="280" fill="#00ff41" opacity="0.2"/>

    <!-- Corner brackets — top left -->
    <g filter="url(#softGlow)" opacity="0.9">
      <line x1="18" y1="18" x2="18" y2="48" stroke="#00ff41" stroke-width="2"/>
      <line x1="18" y1="18" x2="48" y2="18" stroke="#00ff41" stroke-width="2"/>
    </g>

    <!-- Corner brackets — top right -->
    <g filter="url(#softGlow)" opacity="0.9">
      <line x1="882" y1="18" x2="882" y2="48" stroke="#00ff41" stroke-width="2"/>
      <line x1="852" y1="18" x2="882" y2="18" stroke="#00ff41" stroke-width="2"/>
    </g>

    <!-- Corner brackets — bottom left -->
    <g filter="url(#softGlow)" opacity="0.9">
      <line x1="18" y1="262" x2="18" y2="232" stroke="#00ff41" stroke-width="2"/>
      <line x1="18" y1="262" x2="48" y2="262" stroke="#00ff41" stroke-width="2"/>
    </g>

    <!-- Corner brackets — bottom right -->
    <g filter="url(#softGlow)" opacity="0.9">
      <line x1="882" y1="262" x2="882" y2="232" stroke="#00ff41" stroke-width="2"/>
      <line x1="852" y1="262" x2="882" y2="262" stroke="#00ff41" stroke-width="2"/>
    </g>

    <!-- Small decorative dots in corners -->
    <circle cx="18" cy="18" r="2.5" fill="#00ff41" opacity="0.8"/>
    <circle cx="882" cy="18" r="2.5" fill="#00ff41" opacity="0.8"/>
    <circle cx="18" cy="262" r="2.5" fill="#00ff41" opacity="0.8"/>
    <circle cx="882" cy="262" r="2.5" fill="#00ff41" opacity="0.8"/>

    <!-- Terminal prefix top -->
    <text x="70" y="36" font-family="'Courier New', monospace" font-size="11" fill="#00ff41" opacity="0.5">┌──(dx4iot㉿kali)-[~]</text>
    <text x="70" y="54" font-family="'Courier New', monospace" font-size="11" fill="#00ff41" opacity="0.5">└─$ ./dx4iot.sh --init</text>

    <!-- Horizontal separator line after terminal text -->
    <line x1="70" y1="70" x2="450" y2="70" stroke="#00ff41" stroke-width="0.5" opacity="0.3"/>

    <!-- MAIN NAME — dx4iot -->
    <text
      x="450" y="148"
      font-family="'Courier New', Courier, monospace"
      font-size="88"
      font-weight="900"
      letter-spacing="8"
      text-anchor="middle"
      fill="url(#textGrad)"
      filter="url(#glow)"
    >dx4iot</text>

    <!-- Underline glow bar below name -->
    <rect x="200" y="160" width="500" height="2" fill="url(#accentGrad)" opacity="0.6"/>

    <!-- SUBTITLE -->
    <text
      x="450" y="193"
      font-family="'Courier New', Courier, monospace"
      font-size="13"
      letter-spacing="5"
      text-anchor="middle"
      fill="#00ff41"
      opacity="0.75"
    >SECURITY RESEARCHER  ·  BUG HUNTER  ·  EDUCATOR</text>

    <!-- STATUS bar at bottom -->
    <rect x="60" y="220" width="780" height="30" rx="4" fill="#00ff41" fill-opacity="0.04" stroke="#00ff41" stroke-opacity="0.15" stroke-width="0.5"/>

    <!-- Status dots + labels -->
    <circle cx="90" cy="235" r="4" fill="#00ff41">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="102" y="239" font-family="'Courier New', monospace" font-size="10" fill="#00ff41" opacity="0.7">BUG BOUNTY: ACTIVE</text>

    <line x1="230" y1="225" x2="230" y2="245" stroke="#00ff41" stroke-width="0.5" opacity="0.3"/>

    <circle cx="252" cy="235" r="4" fill="#a855f7">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="264" y="239" font-family="'Courier New', monospace" font-size="10" fill="#a855f7" opacity="0.8">UDEMY: 1L+ STUDENTS</text>

    <line x1="400" y1="225" x2="400" y2="245" stroke="#00ff41" stroke-width="0.5" opacity="0.3"/>

    <circle cx="422" cy="235" r="4" fill="#f59e0b">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="434" y="239" font-family="'Courier New', monospace" font-size="10" fill="#f59e0b" opacity="0.8">FREELANCE: OPEN</text>

    <line x1="560" y1="225" x2="560" y2="245" stroke="#00ff41" stroke-width="0.5" opacity="0.3"/>

    <circle cx="582" cy="235" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="594" y="239" font-family="'Courier New', monospace" font-size="10" fill="#38bdf8" opacity="0.8">TRADING: RUNNING</text>

    <line x1="720" y1="225" x2="720" y2="245" stroke="#00ff41" stroke-width="0.5" opacity="0.3"/>

    <text x="734" y="239" font-family="'Courier New', monospace" font-size="10" fill="#00ff41" opacity="0.4">India 🇮🇳</text>

    <!-- Blinking cursor at end of main name area -->
    <rect x="750" y="118" width="12" height="38" fill="#00ff41" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0;0.7" dur="1s" repeatCount="indefinite"/>
    </rect>

  </g>
</svg>
